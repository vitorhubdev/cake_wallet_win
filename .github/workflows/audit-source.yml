name: Windows stability audit source
on:
  push:
    branches: [audit-windows-stability]
    paths: [.github/workflows/audit-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 09fd1527a0ae4a43763b270e97c6c1f65981bac0
          persist-credentials: false
      - name: Archive the exact released source without credentials
        run: |
          mkdir -p export
          git archive --format=tar.gz --output=export/source.tar.gz HEAD
          git rev-parse HEAD > export/commit.txt
          sha256sum export/source.tar.gz > export/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cake-windows-audit-source
          path: export/
          retention-days: 3
          if-no-files-found: error
