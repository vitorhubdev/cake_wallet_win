name: Windows x64

on:
  push:
    branches: [dev, windows-ci, 'windows-ci-*']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Optional earlier run with the identical Monero build recipe to reuse'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monero-native:
    name: Build pinned Monero for Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    env:
      MONERO_BUILD_JOBS: '2'
      NUM_CORES: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select an explicitly requested native build
        id: native-source
        env:
          INPUT_NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os, re
          run_id = os.environ.get('INPUT_NATIVE_RUN_ID', '').strip()
          if not run_id:
              match = re.search(r'(?m)^\[native-run:([0-9]+)\]$', os.environ.get('COMMIT_MESSAGE', ''))
              run_id = match[1] if match else ''
          if run_id and (not re.fullmatch(r'[1-9][0-9]{0,18}', run_id) or run_id == os.environ['GITHUB_RUN_ID']):
              raise SystemExit('Invalid native source run; never wait on this same workflow run.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run_id=' + run_id + '\n')
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: monero-output
        with:
          path: build/windows-native/monero
          key: windows-monero-33671871-v1-${{ hashFiles('scripts/windows/build_monero.sh') }}
      - name: Verify and await the explicitly requested native source run
        if: steps.monero-output.outputs.cache-hit != 'true' && steps.native-source.outputs.run_id != ''
        timeout-minutes: 285
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ steps.native-source.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" > "$RUNNER_TEMP/native-source-run.json"
          source_commit=$(python3 - "$RUNNER_TEMP/native-source-run.json" <<'PY'
          import json, os, re, sys
          data = json.load(open(sys.argv[1]))
          if data['head_repository']['full_name'] != os.environ['GITHUB_REPOSITORY'] or data['event'] not in ('push', 'workflow_dispatch'):
              raise SystemExit('Reuse only a push/manual native build in this same repository.')
          if data['path'] != '.github/workflows/windows-build.yml' or not re.fullmatch(r'[0-9a-f]{40}', data['head_sha']):
              raise SystemExit('The requested source run is not this Windows build workflow.')
          print(data['head_sha'])
          PY
          )
          expected_recipe=$(git hash-object scripts/windows/build_monero.sh)
          source_recipe=$(gh api "repos/$GITHUB_REPOSITORY/contents/scripts/windows/build_monero.sh?ref=$source_commit" --jq '.sha')
          if [ "$source_recipe" != "$expected_recipe" ]; then
            echo 'The requested native build used a different source pin or build recipe.' >&2
            exit 1
          fi
          pwsh -NoProfile -File scripts/windows/wait_for_monero.ps1 -Repository "$GITHUB_REPOSITORY" -RunId "$NATIVE_RUN_ID" -TimeoutMinutes 280
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.monero-output.outputs.cache-hit != 'true' && steps.native-source.outputs.run_id != ''
        with:
          name: windows-monero-native
          path: build/windows-native/monero
          run-id: ${{ steps.native-source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Make room for the isolated native toolchain
        if: steps.monero-output.outputs.cache-hit != 'true' && steps.native-source.outputs.run_id == ''
        run: |
          # Only unused, preinstalled SDKs on this disposable Linux runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h .
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.monero-output.outputs.cache-hit != 'true' && steps.native-source.outputs.run_id == ''
        with:
          go-version: '1.25.1'
          cache: false
      - name: Install native build tools
        if: steps.monero-output.outputs.cache-hit != 'true' && steps.native-source.outputs.run_id == ''
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y build-essential clang llvm git curl ca-certificates patch pkg-config autoconf automake libtool gperf bison flex texinfo python3 xz-utils unzip zip bzip2 file binutils cmake
      - name: Prepare pinned Monero and dependency-builder sources
        if: steps.monero-output.outputs.cache-hit != 'true' && steps.native-source.outputs.run_id == ''
        run: |
          set -euo pipefail
          source_dir=build/windows-native-src/monero_c
          git clone --filter=blob:none --no-checkout https://github.com/MrCyjaneK/monero_c.git "$source_dir"
          git -C "$source_dir" checkout --detach 33671871de3d51696b66ffb3bd94f744e26974f6
          git clone --filter=blob:none --no-checkout https://github.com/MrCyjaneK/simplybs.git "$source_dir/contrib/depends/simplybs"
          git -C "$source_dir/contrib/depends/simplybs" checkout --detach 9b1e86953fde5827d903243fc230ad66d39b6de0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.monero-output.outputs.cache-hit != 'true' && steps.native-source.outputs.run_id == ''
        id: monero-toolchain
        with:
          path: |
            build/windows-native-src/monero_c/contrib/depends/simplybs/.buildlib/linux_amd64/built
            build/windows-native-src/monero_c/contrib/depends/simplybs/.buildlib/source
          key: monero-toolchain-linux-x64-9b1e8695-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monero-toolchain-linux-x64-9b1e8695-v1-
      - name: Compile the pinned Monero backend and matching runtimes
        if: steps.monero-output.outputs.cache-hit != 'true' && steps.native-source.outputs.run_id == ''
        id: monero-build
        timeout-minutes: 260
        run: bash scripts/windows/build_monero.sh
      - name: Preserve completed toolchain packages, including after a build failure
        if: ${{ !cancelled() && steps.monero-build.outcome != 'skipped' && steps.monero-build.outcome != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/windows-native-src/monero_c/contrib/depends/simplybs/.buildlib/linux_amd64/built
            build/windows-native-src/monero_c/contrib/depends/simplybs/.buildlib/source
          key: ${{ steps.monero-toolchain.outputs.cache-primary-key }}
      - name: Verify the completed native artifact before reuse or publication
        run: python3 -c 'from scripts.windows.prepare_dependencies import verify_monero; verify_monero()'
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && steps.monero-output.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: build/windows-native/monero
          key: ${{ steps.monero-output.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-monero-native
          path: build/windows-native/monero/
          if-no-files-found: error
          retention-days: 14

  native:
    name: Build Windows native libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: cw_mweb/go/go.sum
      - name: Install Windows cross compiler
        timeout-minutes: 8
        run: |
          # The Azure mirror throttled the compiler download to about 110 KB/s
          # on a hosted runner. Use Ubuntu's HTTPS mirror; APT still verifies
          # the signed index and package hashes.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Build MWEB and its Windows runtime
        run: bash scripts/windows/build_mweb.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native
          path: build/windows-native/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified Windows download
    needs: windows
    if: github.repository == 'vitorhubdev/cake_wallet_win'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CakeWallet-Windows-x64
          path: dist
      - name: Publish the tested bundle and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tag="windows-6.5.0-${BUILD_NUMBER}-${BUILD_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          Community Windows x64 build of Cake Wallet. This is not an official Cake Labs release.

          Download the Setup.exe installer to install Cake Wallet Windows for your Windows user. It includes the application and its required DLLs. A portable ZIP is also available: extract it completely and run CakeWallet.exe. SHA256SUMS.txt verifies both downloads; build-info.json identifies the source and toolchain.

          Required CI gates: native MWEB string-ownership regression tests; stable upgrade configuration tests; packaged DLL loading and release-process launch; offline Monero TESTNET wallet creation, storage, incorrect-password rejection and reopening; real application onboarding; silent installation, installed DLL loading and launch, and uninstallation in a disposable runner. No real funds are used. Mainnet sync, payments, hardware wallets and commercial integrations are not established by these checks.

          Windows Monero improvements: desktop navigation with sections initialized on first use; a persistent XMR connection panel with the current node and a manual node-management shortcut; responsive onboarding. Reconnection regression tests cover listener disposal, stale results and overlapping checks. Loopback socket tests cover direct HTTP probe deadlines and digest-client cleanup. Blockchain synchronization speed has not been benchmarked; experimental automatic node switching remains disabled.

          Monero is compiled in Release mode from the exact pinned source revision used by the Dart bindings, with matching native checksums. Production Cake API keys are not included. This Windows profile does not include Wownero, Zcash, Zano, Decred or bundled Tor. Builds are unsigned. Use a new empty wallet to verify your environment before using funds. This fork keeps its compatibility constants stable across updates; do not import another build's encrypted application directory.
          NOTES
          gh release create "$tag" dist/*.zip dist/*-Setup.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$BUILD_COMMIT" \
            --title "Cake Wallet Windows x64 — 6.5.0 build $BUILD_NUMBER" \
            --notes-file release-notes.md --prerelease

  windows:
    name: Build and verify Windows x64
    needs: native
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      PUB_CACHE: C:\pub-cache
      CARGO_TARGET_DIR: C:\cargo-target
    steps:
      - name: Configure Git for Windows paths and symlinks
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-native
          path: build/windows-native
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependencies
        with:
          path: |
            C:\pub-cache
            scripts/.cache/windows
          key: windows-deps-v1-${{ hashFiles('pubspec_overrides.yaml', '**/pubspec.yaml', 'scripts/windows/prepare_dependencies.py') }}
          restore-keys: windows-deps-v1-
      - name: Prepare checksum-pinned upstream dependencies
        run: python scripts/windows/prepare_dependencies.py --sources-only
      - name: Resolve Flutter dependencies and validate native MWEB
        run: ./scripts/windows/build.ps1 -Stage Configure -SkipPrepare -BuildNumber ${{ github.run_number }}
      - name: Preserve resolved dependencies before compilation and tests
        if: steps.dependencies.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            C:\pub-cache
            scripts/.cache/windows
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Cache Rust dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
          key: windows-rust-v1-${{ hashFiles('pubspec_overrides.yaml', 'scripts/windows/prepare_dependencies.py') }}
          restore-keys: windows-rust-v1-
      - name: Generate code and validate upgrade compatibility
        run: ./scripts/windows/build.ps1 -Stage Generate -BuildNumber ${{ github.run_number }}
      - name: Wait for the parallel Monero native build
        timeout-minutes: 305
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/windows/wait_for_monero.ps1 -Repository '${{ github.repository }}' -RunId ${{ github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-monero-native
          path: build/windows-native/monero
      - name: Compile release and bundle native runtimes
        run: ./scripts/windows/build.ps1 -Stage Build -BuildNumber ${{ github.run_number }}
      - name: Verify DLLs and launch the release executable
        run: ./scripts/windows/smoke_test.ps1
      - name: Create, store and reopen an offline Monero testnet wallet
        run: dart run tool/windows_monero_smoke.dart (Resolve-Path build/windows/x64/runner/Release).Path
      - name: Verify real application onboarding
        run: |
          $env:CAKE_WALLET_DIR = Join-Path $env:RUNNER_TEMP ('cw-startup-' + [Guid]::NewGuid())
          flutter test integration_test/windows_startup_test.dart -d windows --timeout 3m --reporter expanded --dart-define-from-file=build/windows-build-env.json
      - name: Package the complete portable bundle
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item docs/builds/WINDOWS_FORK.md build/windows/x64/runner/Release/README-WINDOWS.md
          $name = 'CakeWallet-Windows-x64-6.5.0-${{ github.run_number }}'
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          "## Windows build`n`nPortable bundle: $name.zip`n`nCommit: ${{ github.sha }}`n`nSHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Build the complete Windows installer
        run: ./scripts/windows/package_installer.ps1 -Version 6.5.0 -BuildNumber ${{ github.run_number }}
      - name: Verify installation, installed application and uninstallation
        run: |
          $name = 'CakeWallet-Windows-x64-6.5.0-${{ github.run_number }}-Setup.exe'
          ./scripts/windows/install_smoke_test.ps1 -InstallerPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Add-Content "dist/SHA256SUMS.txt" -Encoding ascii
          "`nInstaller: $name`n`nSHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CakeWallet-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-diagnostics
          path: |
            build/windows-smoke/
            build/windows-install-smoke/
            build/integration_test/
            build/integration_test_screenshots/
          if-no-files-found: ignore
          retention-days: 14
