name: Cake Wallet PC Linux native
on:
  push:
    branches: [main]
    paths: [.github/workflows/pc-native-linux.yml, scripts/pc/build_monero_linux.sh]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: pc-native-linux-33671871-release
  cancel-in-progress: false
jobs:
  monero:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      MONERO_BUILD_JOBS: '2'
      NUM_CORES: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: output
        with:
          path: build/linux-native/monero
          key: pc-linux-monero-33671871-release-v1-${{ hashFiles('scripts/pc/build_monero_linux.sh') }}
      - name: Prepare isolated build host
        if: steps.output.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --no-install-recommends -y build-essential clang llvm git curl ca-certificates patch pkg-config autoconf automake libtool gperf bison flex texinfo python3 xz-utils unzip zip bzip2 file binutils cmake
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: steps.output.outputs.cache-hit != 'true'
        with:
          go-version: '1.25.1'
          cache: false
      - name: Prepare pinned sources and shared toolchain layout
        if: steps.output.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source_dir=build/windows-native-src/monero_c
          git clone --filter=blob:none --no-checkout https://github.com/MrCyjaneK/monero_c.git "$source_dir"
          git -C "$source_dir" checkout --detach 33671871de3d51696b66ffb3bd94f744e26974f6
          git clone --filter=blob:none --no-checkout https://github.com/MrCyjaneK/simplybs.git "$source_dir/contrib/depends/simplybs"
          git -C "$source_dir/contrib/depends/simplybs" checkout --detach 9b1e86953fde5827d903243fc230ad66d39b6de0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.output.outputs.cache-hit != 'true'
        id: toolchain
        with:
          path: |
            build/windows-native-src/monero_c/contrib/depends/simplybs/.buildlib/linux_amd64/built
            build/windows-native-src/monero_c/contrib/depends/simplybs/.buildlib/source
          key: monero-toolchain-linux-x64-9b1e8695-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monero-toolchain-linux-x64-9b1e8695-v1-
      - name: Build exact XMR source with optimized release configuration
        if: steps.output.outputs.cache-hit != 'true'
        id: native-build
        run: bash scripts/pc/build_monero_linux.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.native-build.outcome != 'skipped' && steps.native-build.outcome != '' }}
        continue-on-error: true
        with:
          path: |
            build/windows-native-src/monero_c/contrib/depends/simplybs/.buildlib/linux_amd64/built
            build/windows-native-src/monero_c/contrib/depends/simplybs/.buildlib/source
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Verify cached or newly built library
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('build/linux-native/monero')
          m=json.loads((root/'native-build-info.json').read_text())
          assert m['commit']=='33671871de3d51696b66ffb3bd94f744e26974f6'
          assert m['target']=='x86_64-linux-gnu' and m['buildType']=='Release'
          assert set(m['files'])=={'libmonero_wallet2_api_c.so'}
          for name,digest in m['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          PY
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.output.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: build/linux-native/monero
          key: ${{ steps.output.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pc-linux-monero-native
          path: build/linux-native/monero/
          if-no-files-found: error
          retention-days: 30
